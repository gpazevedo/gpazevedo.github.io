<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="616" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 616" role="img" aria-label="Each step is a fresh agent that sees only what it needs" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="sees-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Each step is a fresh agent that sees only what it needs</text><text x="24" y="54" font-size="11.5" fill="#5c6370">One round. Left: material fixed and tagged before any candidate skill exists.</text><g><rect x="24" y="72" width="220" height="408" rx="8" fill="#f3f4f6" stroke="#8a9099" stroke-width="1"/><text x="40" y="96" font-weight="600" fill="#1f2328">Fixed and tagged first</text></g><g><rect x="40" y="120" width="188" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="54" y="144" font-weight="600" fill="#1f2328">Frozen variants</text><text x="54" y="164" font-size="11.5" fill="#5c6370">Original and revision,</text><text x="54" y="180" font-size="11.5" fill="#5c6370">same names and files</text></g><g><rect x="40" y="256" width="188" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="54" y="280" font-weight="600" fill="#1f2328">Hidden cases</text><text x="54" y="300" font-size="11.5" fill="#5c6370">Six per skill, each</text><text x="54" y="316" font-size="11.5" fill="#5c6370">with planted traps</text></g><g><rect x="40" y="392" width="188" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="54" y="416" font-weight="600" fill="#1f2328">Keys and rubric</text><text x="54" y="436" font-size="11.5" fill="#5c6370">Plus the decision rule,</text><text x="54" y="452" font-size="11.5" fill="#5c6370">fixed before generation</text></g><g fill="none" stroke="#8a9099" stroke-width="1.25"><path d="M228 156H300" marker-end="url(#sees-arrow)"/><path d="M228 292H300" marker-end="url(#sees-arrow)"/><path d="M228 428H300" marker-end="url(#sees-arrow)"/><path d="M340 200V248" marker-end="url(#sees-arrow)"/><path d="M340 336V384" marker-end="url(#sees-arrow)"/><path d="M340 472V520" marker-end="url(#sees-arrow)"/></g><text x="352" y="228" font-size="11.5" fill="#5c6370">skills under random labels; label map hash committed</text><text x="352" y="364" font-size="11.5" fill="#5c6370">outputs under fresh IDs, reshuffled per case</text><text x="352" y="500" font-size="11.5" fill="#5c6370">all grades committed before the map is opened</text><g><rect x="300" y="112" width="412" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="316" y="136" font-weight="600" fill="#1f2328">Generators</text><text x="316" y="156" font-size="11.5" fill="#5c6370">One fresh agent per candidate skill</text><text x="316" y="172" font-size="11.5" fill="#1f2328">Sees: one variant, unnamed, and the skill request</text><text x="316" y="188" font-size="11.5" fill="#1f2328">Never sees: the cases, the answer keys, the other variant</text></g><g><rect x="300" y="248" width="412" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="316" y="272" font-weight="600" fill="#1f2328">Runners</text><text x="316" y="292" font-size="11.5" fill="#5c6370">One fresh agent per candidate skill and case</text><text x="316" y="308" font-size="11.5" fill="#1f2328">Sees: one candidate skill and one case's inputs</text><text x="316" y="324" font-size="11.5" fill="#1f2328">Never sees: the answer key, the rubric, or the variant</text></g><g><rect x="300" y="384" width="412" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="316" y="408" font-weight="600" fill="#1f2328">Graders</text><text x="316" y="428" font-size="11.5" fill="#5c6370">Fresh agents, two per case from experiment 2 on</text><text x="316" y="444" font-size="11.5" fill="#1f2328">Sees: the rubric, the case, its answer key, every output</text><text x="316" y="460" font-size="11.5" fill="#1f2328">Never sees: which variant produced which output</text></g><g><rect x="300" y="520" width="412" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/><text x="316" y="544" font-weight="600" fill="#1f2328">Unblind and decide</text><text x="316" y="564" font-size="11.5" fill="#1f2328">Check the label map against its sealed hash, then apply</text><text x="316" y="580" font-size="11.5" fill="#1f2328">the rule: supported, regression or inconclusive</text></g></svg>
