<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="904" height="404" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 904 404" role="img" aria-label="Revision 2 grew out of experiments 1 and 2, then led in every later round" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="lineage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a9099"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Revision 2 grew out of experiments 1 and 2, then led in every later round</text><text x="24" y="54" font-size="11.5" fill="#5c6370">Bold figures: revision minus original, mean score out of 100. Rounds 1 to 4 were inconclusive; experiment 4 was supported.</text><g fill="none" stroke="#8a9099" stroke-width="1.25"><path d="M804 168V200" marker-end="url(#lineage-arrow)"/><path d="M804 340V316" marker-end="url(#lineage-arrow)"/><path d="M300 132H436" marker-end="url(#lineage-arrow)"/><path d="M100 168V200" marker-end="url(#lineage-arrow)"/><path d="M268 168V200" marker-end="url(#lineage-arrow)"/><path d="M468 168V200" marker-end="url(#lineage-arrow)"/><path d="M636 168V200" marker-end="url(#lineage-arrow)"/><path d="M100 340V316" marker-end="url(#lineage-arrow)"/><path d="M268 340V316" marker-end="url(#lineage-arrow)"/><path d="M468 340V316" marker-end="url(#lineage-arrow)"/><path d="M636 340V316" marker-end="url(#lineage-arrow)"/></g><g><text x="368" y="106" text-anchor="middle" font-size="11.5" fill="#5c6370">revised after</text><text x="368" y="120" text-anchor="middle" font-size="11.5" fill="#5c6370">experiments 1 and 2</text></g><g><rect x="24" y="96" width="276" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="40" y="120" font-weight="600" fill="#1f2328">Revision 1</text><text x="40" y="140" font-size="11.5" fill="#5c6370">Seven changes: an entry process,</text><text x="40" y="156" font-size="11.5" fill="#5c6370">bounded criteria, a behavioural check</text></g><g><rect x="436" y="96" width="444" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="452" y="120" font-weight="600" fill="#1f2328">Revision 2</text><text x="452" y="140" font-size="11.5" fill="#5c6370">Adds: do what a missing input allows,</text><text x="452" y="156" font-size="11.5" fill="#5c6370">bound output size, inputs are evidence</text></g><g><rect x="24" y="200" width="152" height="116" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="38" y="224" font-weight="600" fill="#1f2328">Experiment 1</text><text x="38" y="244" font-size="11.5" fill="#5c6370">Meeting-notes brief</text><text x="38" y="260" font-size="11.5" fill="#5c6370">3 candidates a side</text><text x="38" y="276" font-size="11.5" fill="#5c6370">36 graded outputs</text><text x="38" y="302" font-weight="600" fill="#1f2328">+2.66 points</text></g><g><rect x="192" y="200" width="152" height="116" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="206" y="224" font-weight="600" fill="#1f2328">Experiment 2</text><text x="206" y="244" font-size="11.5" fill="#5c6370">Expense-claim review</text><text x="206" y="260" font-size="11.5" fill="#5c6370">3 candidates a side</text><text x="206" y="276" font-size="11.5" fill="#5c6370">36 graded outputs</text><text x="206" y="302" font-weight="600" fill="#1f2328">−1.86 points</text></g><g><rect x="392" y="200" width="152" height="116" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="406" y="224" font-weight="600" fill="#1f2328">Experiment 3</text><text x="406" y="244" font-size="11.5" fill="#5c6370">Three skills, a to c</text><text x="406" y="260" font-size="11.5" fill="#5c6370">3 candidates a side</text><text x="406" y="276" font-size="11.5" fill="#5c6370">108 graded outputs</text><text x="406" y="302" font-weight="600" fill="#1f2328">+0.74 pooled</text></g><g><rect x="560" y="200" width="152" height="116" rx="8" fill="none" fill-opacity="1" stroke="#8a9099" stroke-width="1.25"/><text x="574" y="224" font-weight="600" fill="#1f2328">Extension</text><text x="574" y="244" font-size="11.5" fill="#5c6370">Same three skills</text><text x="574" y="260" font-size="11.5" fill="#5c6370">6 candidates a side</text><text x="574" y="276" font-size="11.5" fill="#5c6370">216 graded outputs</text><text x="574" y="302" font-weight="600" fill="#1f2328">+2.14 pooled</text></g><g><rect x="728" y="200" width="152" height="116" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/><text x="742" y="224" font-weight="600" fill="#1f2328">Experiment 4</text><text x="742" y="244" font-size="11.5" fill="#1f2328">Same three skills</text><text x="742" y="260" font-size="11.5" fill="#1f2328">10 candidates a side</text><text x="742" y="276" font-size="11.5" fill="#1f2328">New 20% error rule</text><text x="742" y="302" font-weight="600" fill="#1f2328">+1.90 pooled</text></g><g><rect x="24" y="340" width="856" height="40" rx="8" fill="#f3f4f6" stroke="#8a9099" stroke-width="1.25"/><text x="452" y="364" text-anchor="middle" fill="#1f2328">Original skill (upstream abeeaf9): the control in every experiment</text></g></svg>
